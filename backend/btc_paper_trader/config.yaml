use_runtime_params: true
symbol: BTCUSDT
base_url: https://fapi.binance.com

intervals:
  # 基準足。列名プレフィックス "m15_" はこの基準足を指す内部固定名（後方互換のため）
  signal: 1h
  # 基準足自身は自動でフェッチ対象に含まれるため、ここには上位足だけを書く
  features:
    - 4h
    - 1d

data:
  cache_sqlite: data/btc_klines.sqlite

regression:
  lookback_bars:
    # m15 は基準足（現在は1h）自身の回帰特徴量
    m15: 96
    "4h": 60
    "1d": 60

pattern:
  window: 32
  top_k: 12
  min_similarity: 0.15
  horizon_bars: 4

model:
  forward_bars: 4
  train_min_samples: 100
  calibration: platt

combine:
  weight_model: 0.55
  weight_pattern: 0.45
  # エントリー頻度を上げる（ペーパー向けに緩め）
  entry_threshold: 0.11

filters:
  enabled: true
  min_confidence: 0.09
  mtf_align_1h: false
  mtf_align_4h: false
  agreement_required: false
  atr_period: 14
  atr_low_quantile: 0.05
  atr_high_quantile: 0.97
  # 低ボラ時の手数料比較で落とされやすいためペーパーでは緩める
  expectancy_gate: false
  taker_fee_rate: 0.0004
  slippage_bps: 2.0
  funding_filter_enabled: true
  # score補正の強さ。大きいほど正Funding時にロングを抑え、負Funding時にショートを抑える。
  funding_score_weight: 0.35
  # hard block 閾値（1回のFunding率）。例 0.00025 = 0.025%
  funding_long_block_above: 0.00025
  funding_short_block_below: -0.00025

risk:
  tp_atr_mult: 1.8
  sl_atr_mult: 1.2
  # 1h足換算で約1日分。基準足を15m→1hへ変更した際に48(=12h)から再スケール。
  # 以後は Claude 自動チューニングが検証しながら調整する
  max_hold_bars: 24
  position_fraction: 0.98
  # リスクガードによる新規停止を減らすため一時的に緩和
  max_daily_loss_pct: 0.08
  cooldown_after_losses: 5
  cooldown_bars: 2
  # 0 = off. After favorable move of this many ATRs, move stop to breakeven (entry).
  trail_breakeven_atr_mult: 0.0
  # 0 = off. Partial take profit at entry +/- this ATR multiple.
  partial_take_profit_atr_mult: 1.0
  # Fraction of current position to close when partial TP is hit.
  partial_take_profit_fraction: 0.5
  # Move stop loss to entry after partial TP.
  partial_take_profit_move_sl_to_be: true
  # 0 = off. ATR trailing stop activated after partial TP.
  trail_after_partial_atr_mult: 1.2
  confidence_tier:
    enabled: true
    # conf <= thresholds[i] uses row i (first match). Tiers from low to high conf.
    thresholds: [0.18, 0.28, 1.01]
    position_fraction: [0.4, 0.7, 0.98]
    tp_atr_mult_scale: [0.95, 1.0, 1.05]
    sl_atr_mult_scale: [1.05, 1.0, 0.95]
    max_hold_bars_scale: [0.85, 1.0, 1.0]

backtest:
  initial_quote: 10000.0
  funding_rate_per_8h: 0.0

walk_forward:
  train_bars: 8000
  test_bars: 1500
  embargo_bars: 500
  step_bars: 1500
  grid:
    tp_atr_mult: [1.4, 1.8, 2.2]
    sl_atr_mult: [1.0, 1.2, 1.5]
    weight_model: [0.45, 0.55, 0.65]
    entry_threshold: [0.14, 0.18, 0.22]
    min_confidence: [0.08, 0.12, 0.16]

paper:
  # 新しい足が閉じたかは壁時計で判定するため、この値は「反応の速さ」だけに影響する
  # （1時間足に対して60秒程度のポーリングは実用上ほぼ無視できる遅延）
  poll_seconds: 60
  timezone: Asia/Tokyo
  train_window_bars: 5000
  state_path: data/paper_state.json
  reload_runtime_params_seconds: 300

tune:
  min_test_trades: 5
  min_profit_factor: 0.0
  skip_if_worse_than_current: true
  score_weights:
    pnl: 1.0
    drawdown_penalty: 0.5
    profit_factor_bonus: 50.0

runtime_guard:
  min_trades: 8
  min_profit_factor: 1.05
  min_win_rate: 0.45
  min_expectancy: 0.0

regime:
  enabled: true
  # |slope| がこの値以下なら方向感が弱いとみなす
  max_abs_slope_1h: 0.0016
  max_abs_slope_4h: 0.0010
  # 低ボラ時のみレンジ扱い
  max_atr_ratio: 0.0045
  range_breakout_guard:
    enabled: true
    # 現在ATR比率が基準(quantile)の何倍以上ならレンジ停止するか
    spike_multiple: 1.8
    baseline_quantile: 0.5
    min_hist_bars: 40
    min_abs_atr_ratio: 0.003

grid:
  enabled: true
  # レンジ中心は基準足終値EMA
  center_ema_window: 48
  # 中心からこのATR倍率を超えたら逆張りエントリー
  step_atr_mult: 0.6
  # 中心付近はノートレード
  deadband_atr_mult: 0.2

entry_timing_1m:
  enabled: true
  # false(既定)ならレンジでは1分足確認を行わず、グリッド成立後に次足で入る
  require_range_confirmation: false
  # 1分足の細かい条件はトレンドのみ（レンジはグリッド判定後、次足成行で入る）
  only_regimes:
    - trend
  ema_fast: 9
  ema_slow: 21
  rsi_period: 14
  breakout_lookback_bars: 3
  trend:
    breakout_buffer_bps: 8.0
  range:
    rsi_overbought: 52
    rsi_oversold: 48

news_filter:
  enabled: true
  live_sync:
    enabled: true
    calendar_url: https://nfs.faireconomy.media/ff_calendar_thisweek.json
    refresh_seconds: 900
    request_timeout_seconds: 8
    # 過去バー（backtest領域）ではライブ同期せず、固定枠にフォールバック
    max_bar_age_hours_for_sync: 72
    impacts: [High]
    countries: [USD]
    block_before_min: 15
    block_after_min: 20
  # UTC基準の定期ウィンドウ（高インパクトイベント対策）
  windows_utc:
    # 米CPI目安: 毎月中旬の発表時間帯に近い枠（曜日固定が難しいので毎平日同時刻をガード）
    - weekday_utc: 0
      hour_utc: 12
      minute_utc: 30
      block_before_min: 20
      block_after_min: 40
    - weekday_utc: 1
      hour_utc: 12
      minute_utc: 30
      block_before_min: 20
      block_after_min: 40
    - weekday_utc: 2
      hour_utc: 12
      minute_utc: 30
      block_before_min: 20
      block_after_min: 40
    - weekday_utc: 3
      hour_utc: 12
      minute_utc: 30
      block_before_min: 20
      block_after_min: 40
    - weekday_utc: 4
      hour_utc: 12
      minute_utc: 30
      block_before_min: 20
      block_after_min: 40
    # FOMC目安（日本時間深夜に相当するUTC枠）
    - weekday_utc: 2
      hour_utc: 18
      minute_utc: 0
      block_before_min: 30
      block_after_min: 90

# `python -m btc_paper_trader tune` が data/runtime_params.json を上書き。
# 次回起動時 load_config が risk / combine / filters をマージする。
# 優先順位: config.yaml < runtime_params.json < config.local.yaml（ダッシュボードの設定保存先）

# Claude Code CLI (サブスク認証・API課金なし) によるAIアドバイザー
advisor:
  # エントリー候補が立った時に Claude へセカンドオピニオンを求める
  enabled: true
  # advise = 記録と通知のみ（エントリーは通常実行） / gate = veto でエントリー中止 / off
  # まず advise で的中率を検証してから gate に切り替えるのを推奨
  mode: advise
  model: haiku
  timeout_seconds: 120
  log_path: data/claude_advice.jsonl
  notify: true

notify:
  # 毎時サマリのDiscord通知。日次サマリ・日次レビュー・自動チューニング通知が
  # あれば十分なため既定はオフ（稼働開始通知は影響を受けない）
  hourly_summary: false

daily_review:
  # 日次ロールオーバー時に Claude がその日のトレードをレビューして Discord へ投稿
  enabled: true
  model: sonnet
  timeout_seconds: 300

param_advisor:
  # ダッシュボードの「Claudeに参考値を聞く」で使うモデルとタイムアウト
  model: sonnet
  timeout_seconds: 240

auto_tune:
  # 日次締め時に Claude が候補提案→リスク審査→what-if検証→現行に勝った場合のみ
  # config.local.yaml へ自動適用（Discord日次チャンネルへ通知、履歴は
  # data/auto_tune_history.jsonl）。資金リスク系パラメータは対象外（手動のみ）。
  enabled: true
  # what-if 検証の期間（日）
  eval_days: 14
  # 1回の変更で許す現在値からの最大変化率（%）
  max_change_pct: 25
  # 採用候補に要求する検証期間中の最低取引数
  min_trades_floor: 5
  # 現行設定に対して要求する最低改善幅（initial_quote比%）。ノイズでの日次揺れを防ぐ
  min_improvement_pct: 0.5
  # Claude に提案させる候補数
  candidates: 4
  model: sonnet
  reviewer_model: sonnet
  timeout_seconds: 300
  # 適用からこの日数経過後、実現PnLが initial_quote×rollback_loss_pct を
  # 下回っていたら前回値へ自動ロールバック
  rollback_after_days: 2
  rollback_loss_pct: 0.02

logging:
  jsonl_path: data/paper_events.jsonl
