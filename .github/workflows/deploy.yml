name: Deploy to server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd /home/itosaku/crypto_radar
          git fetch origin main
          git reset --hard origin/main

      - name: Install dependencies
        run: |
          cd /home/itosaku/crypto_radar/backend
          ./venv/bin/pip install -r requirements.txt
          ./venv/bin/pip install -r btc_paper_trader/requirements-btc.txt

      - name: Restart services
        run: |
          sudo systemctl restart aerodrome-radar.service
          sudo systemctl restart btc-paper-trader.service
          # ダッシュボードはユニット導入済みの場合のみ再起動（失敗は隠さずエラーにする）
          # 要: sudoers に btc-dashboard.service の NOPASSWD 許可（deploy/gcp/README.md 参照）
          if [ -f /etc/systemd/system/btc-dashboard.service ]; then
            sudo -n systemctl restart btc-dashboard.service
            systemctl is-active btc-dashboard.service
          else
            echo "btc-dashboard.service not installed; skipping"
          fi

      - name: Verify services are running
        run: |
          sleep 5
          sudo systemctl is-active aerodrome-radar.service
          sudo systemctl is-active btc-paper-trader.service
