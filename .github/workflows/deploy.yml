name: Deploy to server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd /home/itosaku/crypto_radar
          git fetch origin main
          git reset --hard origin/main

      - name: Install dependencies
        run: |
          cd /home/itosaku/crypto_radar/backend
          ./venv/bin/pip install -r requirements.txt
          ./venv/bin/pip install -r btc_paper_trader/requirements-btc.txt

      - name: Restart services
        run: |
          sudo systemctl restart aerodrome-radar.service
          sudo systemctl restart bribe-sniper.service
          sudo systemctl restart btc-paper-trader.service
          # ダッシュボードはユニット未導入のサーバーでも失敗しないようにする
          sudo systemctl restart btc-dashboard.service 2>/dev/null || true

      - name: Verify services are running
        run: |
          sleep 5
          sudo systemctl is-active aerodrome-radar.service
          sudo systemctl is-active bribe-sniper.service
          sudo systemctl is-active btc-paper-trader.service
